services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      # Only set root password — bench new-site handles all database/user creation
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # localhost-only — erpnext reaches mariadb over the internal Docker network;
      # this is for host-side manual access only (e.g. via SSH tunnel). Never bind 0.0.0.0 here.
      # Use 3307 so WSL host MariaDB (bench start) can keep 3306.
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./50-server.cnf:/etc/mysql/mariadb.conf.d/50-server.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── ERPNext Backend ─────────────────────────────────────────────────────────

  erpnext:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      REDIS_URL: redis://redis:6379
      ERPNEXT_SMTP_EMAIL: ${ERPNEXT_SMTP_EMAIL:-help@l0l.in}
      ERPNEXT_SMTP_PASSWORD: ${ERPNEXT_SMTP_PASSWORD:-}
      ERPNEXT_SMTP_SERVER: ${ERPNEXT_SMTP_SERVER:-smtp.hostinger.com}
      ERPNEXT_SMTP_PORT: ${ERPNEXT_SMTP_PORT:-465}
      ERPNEXT_SMTP_USE_SSL: ${ERPNEXT_SMTP_USE_SSL:-1}
    volumes:
      - frappe_data:/home/frappe/frappe-bench/sites
    networks:
      internal:
        aliases:
          - meilu.local
          - bin.local
      web:
        aliases:
          - meilu.local
          - bin.local

  # ─── ERPNext Dev/Test (on-demand, erp.test / localhost:1271) ────────────────
  # Not started by `docker compose up` or the deploy scripts (profiles: [dev]).
  # Bind-mounts apps/erpnext live from the host checkout — edit and refresh,
  # no image build needed. Own site ("dev.local") + own DB name on the same
  # shared MariaDB, and its own Redis logical DB — isolated from production
  # data/queues while still reusing the same mariadb/redis processes.
  #   Start:  docker compose --profile dev up -d erpnext-dev
  #   Stop:   docker compose --profile dev stop erpnext-dev
  #   Logs:   docker compose logs -f erpnext-dev

  erpnext-dev:
    image: nexterp_monolith-erpnext   # reuse the already-built prod image
    profiles: ["dev"]
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_NAME: erpnext_dev
      SITE_NAME: dev.local
      REDIS_URL: redis://redis:6379/1
    entrypoint: ["/usr/local/bin/entrypoint-dev.sh"]
    volumes:
      - frappe_data_dev:/home/frappe/frappe-bench/sites
      - ../apps/erpnext:/home/frappe/frappe-bench/apps/erpnext
      - ./entrypoint-dev.sh:/usr/local/bin/entrypoint-dev.sh:ro
    ports:
      - "1271:8000"
    networks:
      - internal
      - web

  # ─── React Frontend (blue/green slots) ──────────────────────────────────────
  # Only one slot is active at a time; Caddy routes to the active slot.
  # State is tracked in /var/lib/deploy/active-slot (blue|green).
  # Use scripts/deploy-bg.sh to deploy — do not run 'docker compose up react-blue/green' manually.

  react-blue:
    build:
      # Relative to nexterp_monolith/ — works on prod (/root/code/…) and WSL home checkouts.
      context: ../erpnext-ecommerce
      dockerfile: ../nexterp_monolith/Dockerfile.react
      args:
        NEXT_PUBLIC_ERPNEXT_URL: https://erp.l.l0l.in
        ERPNEXT_URL: http://erpnext:8000
    restart: unless-stopped
    env_file:
      - .env
      - tenant-api-keys.env
    environment:
      ERPNEXT_URL: http://erpnext:8000
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET}
    networks:
      - internal
      - web

  react-green:
    build:
      context: ../erpnext-ecommerce
      dockerfile: ../nexterp_monolith/Dockerfile.react
      args:
        NEXT_PUBLIC_ERPNEXT_URL: https://erp.l.l0l.in
        ERPNEXT_URL: http://erpnext:8000
    restart: unless-stopped
    env_file:
      - .env
      - tenant-api-keys.env
    environment:
      ERPNEXT_URL: http://erpnext:8000
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET}
    networks:
      - internal
      - web

  # ─── Optional TRUE UI forks (not used for meilu/bin — they share blue/green) ─
  # Enable only when a client needs a divergent frontend codebase:
  #   docker compose --profile fork up -d react-meilu
  # See local_docs/g012 § "When to keep a branded React fork".

  react-meilu:
    profiles: ["fork"]
    build:
      context: ../erpnext-ecommerce-meilu
      dockerfile: ../nexterp_monolith/Dockerfile.react
      args:
        NEXT_PUBLIC_ERPNEXT_URL: https://meilu.erp.l.l0l.in
        ERPNEXT_URL: http://meilu.local:8000
    restart: unless-stopped
    env_file:
      - .env.meilu
    environment:
      ERPNEXT_URL: http://meilu.local:8000
    depends_on:
      - erpnext
    networks:
      - internal
      - web

  react-bin:
    profiles: ["fork"]
    build:
      context: ../erpnext-ecommerce-bin
      dockerfile: ../nexterp_monolith/Dockerfile.react
      args:
        NEXT_PUBLIC_ERPNEXT_URL: https://bin.erp.l.l0l.in
        ERPNEXT_URL: http://bin.local:8000
    restart: unless-stopped
    env_file:
      - .env.bin
    environment:
      ERPNEXT_URL: http://bin.local:8000
    depends_on:
      - erpnext
    networks:
      - internal
      - web

volumes:
  mariadb_data:
  redis_data:
  frappe_data:
  frappe_data_dev:

networks:
  internal:             # private network for DB/Redis — not exposed to Caddy
    driver: bridge
  web:
    external: true      # shared with the root docker-compose that runs Caddy
